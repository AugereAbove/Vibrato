[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibrato"
version = "0.1.0"
description = "Local vocal mimicry and singing-analysis workstation (analysis backend)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "praat-parselmouth>=0.4.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "psutil>=5.9",
]

[project.optional-dependencies]
decoders = ["av>=12"]
world = ["pyworld>=0.3.4", "setuptools<81"]
neural = ["torch>=2.1", "torchcrepe>=0.0.22"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
vibrato = "vibrato.__main__:main"

[tool.setuptools.packages.find]
include = ["vibrato*"]

[tool.setuptools.package-data]
vibrato = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning:librosa.*",
  "ignore::FutureWarning",
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "SIM108", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = false
strict_equality = true
exclude = ["tests/"]
